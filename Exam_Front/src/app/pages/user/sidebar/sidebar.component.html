<mat-card class="sidebar-card">
    <mat-action-list>
      <div mat-subheader class="sidebar-title">Available categories</div>
  
      
    <button mat-list-item routerLink="/user-dashboad/load/0">
        <mat-icon mat-list-icon>quiz</mat-icon>
        <span class="nav-text">All Quizes</span>
      </button>
      <button [routerLink]="'/user-dashboad/load/' +c.cid" mat-list-item *ngFor="let c of categories">
        <mat-icon mat-list-icon>quiz</mat-icon>
        <span class="nav-text">{{c.title}}</span>
      </button>
      
      
      
    </mat-action-list>
  </mat-card>
